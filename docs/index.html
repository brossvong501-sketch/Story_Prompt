    <script>
      (function () {
        // If served from raw GitHub Pages repository root, redirect to compiled /docs/
        var isGitHub = window.location.hostname.indexOf('github.io') !== -1;
        var metaTag = document.querySelector('meta[name="build-state"]');
        var isRawSourceHtml = metaTag && metaTag.getAttribute('data-is-raw') === 'true';
        if (isGitHub && isRawSourceHtml) {
          var p = window.location.pathname;
          if (p.indexOf('/docs') === -1 && p.indexOf('/dist') === -1) {
            var base = p.endsWith('/') ? p : p + '/';
            window.location.replace(base + 'docs/' + window.location.search + window.location.hash);
            return;
          }
        }
      })();
    </script>
    <script>
      (function () {
        // AI Studio Environment: HMR WebSocket is disabled in iframe.
        // Intercept Vite HMR WebSockets so @vite/client connects without throwing errors.
        var OrigWebSocket = window.WebSocket;
        function ViteMockWebSocket(url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : (protocols || '');
          var urlStr = String(url || '');
          if (
            protoStr.indexOf('vite') !== -1 ||
            urlStr.indexOf('vite') !== -1 ||
            (urlStr.indexOf('token=') !== -1 && (urlStr.indexOf('vite') !== -1 || urlStr.indexOf('localhost') !== -1 || urlStr.indexOf('127.0.0.1') !== -1))
          ) {
            var listeners = {};
            var wsObj = {
              readyState: 1, // WebSocket.OPEN
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              url: urlStr,
              protocol: Array.isArray(protocols) ? (protocols[0] || '') : (protocols || ''),
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              addEventListener: function (type, listener) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(listener);
                if (type === 'open') {
                  setTimeout(function () {
                    if (typeof listener === 'function') {
                      listener({ type: 'open', target: wsObj });
                    }
                  }, 0);
                }
              },
              removeEventListener: function (type, listener) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function (fn) { return fn !== listener; });
                }
              },
              dispatchEvent: function () { return true; },
              send: function () {},
              close: function () {
                wsObj.readyState = 3;
              }
            };
            return wsObj;
          }
          return OrigWebSocket ? new OrigWebSocket(url, protocols) : {};
        }

        if (OrigWebSocket) {
          ViteMockWebSocket.prototype = OrigWebSocket.prototype;
          ViteMockWebSocket.OPEN = 1;
          ViteMockWebSocket.CLOSED = 3;
          ViteMockWebSocket.CLOSING = 2;
          ViteMockWebSocket.CONNECTING = 0;
          window.WebSocket = ViteMockWebSocket;
        }

        // Suppress WebSocket errors in unhandledrejection and window.onerror
        function isViteWsError(err) {
          if (!err) return false;
          var str = (err.message || '') + ' ' + (err.stack || '') + ' ' + String(err);
          return str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('vite-hmr') !== -1;
        }

        window.addEventListener('unhandledrejection', function (e) {
          if (e && isViteWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          if (e && (isViteWsError(e.error) || (e.message && e.message.indexOf('WebSocket') !== -1) || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Filter console.error for vite websocket connection logs
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function (a) { return String(a || ''); }).join(' ');
          if (joined.indexOf('[vite] failed to connect to websocket') !== -1 || joined.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
